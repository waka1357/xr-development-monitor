[project]
name = "xr-development-monitor"
version = "0.1.0"
description = "Accuracy-first monitoring for Unity and Meta Quest XR development updates."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "beautifulsoup4>=4.12,<5",
  "httpx>=0.27,<1",
  "Jinja2>=3.1,<4",
  "pydantic>=2.9,<3",
  "PyYAML>=6,<7",
]

[dependency-groups]
dev = [
  "mypy>=1.13,<2",
  "pytest>=8.3,<9",
  "ruff>=0.8,<1",
  "types-PyYAML>=6.0.12.20250915,<7",
]

[project.scripts]
xr-monitor = "xr_monitor.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/xr_monitor"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["xr_monitor"]
